# Kitty Terminal Configuration

# Font settings
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        11.0

# Cursor settings
cursor_shape     block
cursor_blink     yes

# Window settings
window_padding_width 10

# Scrollback
scrollback_lines 10000

# Mouse
copy_on_select   yes

# Shell
shell            /bin/bash

# Color scheme (will be overridden by theme)
include          ./colors.conf
